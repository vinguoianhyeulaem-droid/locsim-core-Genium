name: LocSimIndependent
options:
  deploymentTarget:
    iOS: '15.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGNING_ALLOWED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  LocSimIndependent:
    type: application
    platform: iOS
    sources:
      - path: LocSim
        excludes:
          - LocSimPrivateHeaders.h
          - BridgingHeader.h
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.locsim.independent
        PRODUCT_NAME: LocSimIndependent
        SWIFT_OBJC_BRIDGING_HEADER: LocSim/BridgingHeader.h
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LoTNG
        INFOPLIST_KEY_CFBundleShortVersionString: 1.1.1
        INFOPLIST_KEY_CFBundleVersion: 3
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Uses location to show the map.
        SUPPORTS_MACCATALYST: NO
        IPHONEOS_DEPLOYMENT_TARGET: '15.0'
